# Deploys the arr-stack (Prowlarr, qBittorrent, LazyLibrarian, Mylar3) as a
# single unit, kept separate from the generic `services` role since these
# containers form one interconnected stack rather than independent services.
#
# Controlled by `arr_stack_enabled` in all.yaml - set to false to tear it
# down without removing it from the repo.

- name: create arr-stack directory on host
  file:
    path: "{{ root_path }}/arr-stack"
    state: directory
    owner: "{{ new_user }}"
    group: "{{ new_user }}"
    mode: '0755'
  when: arr_stack_enabled | default(false)

- name: create arr-stack data directories
  file:
    path: "{{ data_path }}/arr-stack/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - prowlarr/config
    - qbittorrent/config
    - lazylibrarian/config
    - mylar3/config
    - downloads
  when: arr_stack_enabled | default(false)

- name: copy arr-stack docker-compose file
  copy:
    src: "{{ playbook_dir }}/../arr-stack/docker-compose.yaml"
    dest: "{{ root_path }}/arr-stack/docker-compose.yaml"
    mode: '0644'
  when: arr_stack_enabled | default(false)

- name: template arr-stack .env file
  template:
    src: "{{ playbook_dir }}/../arr-stack/arr-stack.env.j2"
    dest: "{{ root_path }}/arr-stack/.env"
    mode: '0600'
  when: arr_stack_enabled | default(false)

- name: deploy arr-stack
  community.docker.docker_compose_v2:
    project_src: "{{ root_path }}/arr-stack"
    state: present
  when: arr_stack_enabled | default(false)

- name: stop and remove arr-stack if disabled
  community.docker.docker_compose_v2:
    project_src: "{{ root_path }}/arr-stack"
    state: absent
  when: not (arr_stack_enabled | default(false))
  ignore_errors: true