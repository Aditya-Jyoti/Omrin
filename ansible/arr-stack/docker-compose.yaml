# Self-hosted book/manga acquisition stack, kept deliberately separate from
# ansible/services/ since these containers are meant to talk to each other
# directly (Prowlarr <-> qBittorrent <-> LazyLibrarian/Mylar3) rather than
# being independent single-purpose services.
#
# - Prowlarr:      shared indexer manager, feeds both LazyLibrarian and Mylar3
# - qBittorrent:   shared download client
# - LazyLibrarian: books + light novels -> lands in Kavita's books/light_novels
# - Mylar3:        manga/comics -> lands in Kavita's manga folder

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    volumes:
      - ${DATA_PATH:?}/arr-stack/prowlarr/config:/config
    ports:
      # Bound to localhost only - not exposed to the internet, reachable
      # only via SSH tunnel: ssh -L 9696:localhost:9696 omrin
      - "127.0.0.1:9696:9696"

    networks:
      # - proxy
      - arr-internal
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN:?}`)
    #   - traefik.http.services.prowlarr.loadbalancer.server.port=9696

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ${DATA_PATH:?}/arr-stack/qbittorrent/config:/config
      - ${DATA_PATH:?}/arr-stack/downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      # Web UI bound to localhost only - reachable via SSH tunnel:
      # ssh -L 8080:localhost:8080 omrin
      - "127.0.0.1:8080:8080"

    networks:
      # - proxy
      - arr-internal
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAIN:?}`)
    #   - traefik.http.services.qbittorrent.loadbalancer.server.port=8080

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    volumes:
      - ${DATA_PATH:?}/arr-stack/lazylibrarian/config:/config
      - ${DATA_PATH:?}/arr-stack/downloads:/downloads

      # Books and light novels are both plain ebooks format-wise, so
      # LazyLibrarian covers both, writing into separate Kavita folders.
      - ${DATA_PATH:?}/kavita/books:/books
      - ${DATA_PATH:?}/kavita/light_novels:/light_novels
    networks:
      - proxy
      - arr-internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.lazylibrarian.rule=Host(`books.${DOMAIN:?}`)
      - traefik.http.services.lazylibrarian.loadbalancer.server.port=5299
      - traefik.docker.network=proxy

  mylar3:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar3
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    volumes:
      - ${DATA_PATH:?}/arr-stack/mylar3/config:/config
      - ${DATA_PATH:?}/arr-stack/downloads:/downloads
      - ${DATA_PATH:?}/kavita/manga:/comics
    networks:
      - proxy
      - arr-internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.mylar3.rule=Host(`manga.${DOMAIN:?}`)
      - traefik.http.services.mylar3.loadbalancer.server.port=8090
      - traefik.docker.network=proxy

networks:
  proxy:
    external: true
  arr-internal:
