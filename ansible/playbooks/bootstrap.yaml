- hosts: all
  become: true

  vars_files:
    - ../group_vars/all.yaml

  tasks:
    # BASE SETUP

    - name: update apt cache
      apt:
        update_cache: yes

    - name: install required packages
      apt:
        name:
          - sudo
        state: present

    # USER SETUP — must complete before the ssh role disables password auth,
    # otherwise risk locking yourself out.

    - name: create new user
      user:
        name: "{{ new_user }}"
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes

    - name: add ssh key for new user
      authorized_key:
        user: "{{ new_user }}"
        key: "{{ lookup('file', ssh_public_key_path) }}"
        state: present

    - name: allow passwordless sudo
      copy:
        dest: "/etc/sudoers.d/{{ new_user }}"
        content: "{{ new_user }} ALL=(ALL) NOPASSWD:ALL"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: ensure ssh is running
      service:
        name: ssh
        state: started

    # SSH HARDENING — imported as a role here (not under `roles:`) so it runs
    # AFTER the deploy user and its key are in place. Note: `roles:` always runs
    # before `tasks:`, so import_role is the only way to control ordering.
    - name: harden ssh
      import_role:
        name: ssh
