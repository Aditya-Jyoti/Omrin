services:
  affine-postgres:
    image: pgvector/pgvector:pg16
    container_name: affine-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=affine
      - POSTGRES_DB=affine
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ${DATA_PATH:?}/affine/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine-internal

  affine-redis:
    image: redis
    container_name: affine-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine-internal

  affine-migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-migration
    volumes:
      - ${DATA_PATH:?}/affine/storage:/root/.affine/storage
      - ${DATA_PATH:?}/affine/config:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - REDIS_SERVER_HOST=affine-redis
      - DATABASE_URL=postgresql://affine@affine-postgres:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
    networks:
      - affine-internal

  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine
    restart: unless-stopped
    volumes:
      - ${DATA_PATH:?}/affine/storage:/root/.affine/storage
      - ${DATA_PATH:?}/affine/config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=affine-redis
      - DATABASE_URL=postgresql://affine@affine-postgres:5432/affine
      - AFFINE_INDEXER_ENABLED=false
      - AFFINE_SERVER_EXTERNAL_URL=https://notes.${DOMAIN:?}
      - AFFINE_SERVER_HTTPS=true
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3010', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 1m
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.affine.rule=Host(`notes.${DOMAIN:?}`)"
      - "traefik.http.services.affine.loadbalancer.server.port=3010"
    networks:
      - proxy
      - affine-internal

  affine-mcp:
    image: ghcr.io/dawncr0w/affine-mcp-server:latest
    container_name: affine-mcp
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - AFFINE_BASE_URL=http://affine:3010
      - AFFINE_ALLOW_INSECURE_HTTP=true
      - AFFINE_EMAIL=${AFFINE_MCP_EMAIL:?}
      - AFFINE_PASSWORD=${AFFINE_MCP_PASSWORD:?}
      - AFFINE_MCP_AUTH_MODE=bearer
      - AFFINE_MCP_HTTP_HOST=0.0.0.0
      - AFFINE_MCP_HTTP_TOKEN=${AFFINE_MCP_HTTP_TOKEN:?}
      - PORT=3000
    depends_on:
      - affine
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/healthz'}, r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 1m
      timeout: 10s
      retries: 3
    networks:
      - affine-internal
      - mcp

networks:
  proxy:
    external: true
  mcp:
    external: true
  affine-internal: