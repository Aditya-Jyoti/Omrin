services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ${DATA_PATH:?}/crafty/backups:/crafty/backups
      - ${DATA_PATH:?}/crafty/config:/crafty/app/config

      # Not backed up - live world files (inconsistent mid-write, covered by backups/ above)
      - /opt/crafty/servers:/crafty/servers
      # Not backed up - ephemeral
      - /opt/crafty/logs:/crafty/logs
      - /opt/crafty/import:/crafty/import
    ports:
      - "8443:8443"
      - "25500-25600:25500-25600"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.crafty.rule=Host(`mc.${DOMAIN:?}`)
      - traefik.http.routers.crafty.entrypoints=websecure
      - traefik.http.routers.crafty.tls=true
      - traefik.http.routers.crafty.tls.certresolver=letsencrypt
      - traefik.http.services.crafty.loadbalancer.server.port=8443
      - traefik.http.services.crafty.loadbalancer.server.scheme=https
      - traefik.http.middlewares.crafty-proto.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.crafty.middlewares=crafty-proto

networks:
  proxy:
    external: true
