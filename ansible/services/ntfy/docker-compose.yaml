services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    restart: unless-stopped
    init: true
    command:
      - serve
    environment:
      TZ: Asia/Kolkata
      NTFY_BASE_URL: https://ntfy.${DOMAIN:?}
    volumes:
      - ${DATA_PATH:?}/ntfy/cache:/var/cache/ntfy
      - ${DATA_PATH:?}/ntfy/config:/etc/ntfy
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN:?}`)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true
