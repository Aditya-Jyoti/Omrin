services:
  app:
    image: fireflyiii/core:latest
    container_name: firefly-app
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?}
      APP_URL: https://finance.${DOMAIN:?}
      TZ: Asia/Kolkata
      SITE_OWNER: ${EMAIL:?}
      # Behind Traefik - trust the proxy so URLs/redirects resolve correctly.
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${DB_PASSWORD:?}
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN:?}
      NTFY_SERVER: https://ntfy.${DOMAIN:?}
      NTFY_TOKEN: "" # leave empty if your ntfy is open (no auth)
      NTFY_TOPIC: ${NTFY_FIREFLY_TOPIC:?}
    volumes:
      - ${DATA_PATH:?}/firefly/upload:/var/www/html/storage/upload
    networks:
      - proxy
      - firefly-internal
    depends_on:
      - db
    labels:
      - traefik.enable=true
      - traefik.http.routers.firefly.rule=Host(`finance.${DOMAIN:?}`)
      - traefik.http.services.firefly.loadbalancer.server.port=8080
      - traefik.docker.network=proxy

  db:
    image: mariadb:lts
    container_name: firefly-db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_DATABASE: firefly
    volumes:
      - ${DATA_PATH:?}/firefly/db:/var/lib/mysql
    networks:
      - firefly-internal

  cron:
    image: alpine
    container_name: firefly-cron
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN:?}
    command: [
        "sh",
        "-c",
        "apk add tzdata && \
        (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
        echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\" \
        | crontab - && \
        crond -f -L /dev/stdout",
      ]
    networks:
      - firefly-internal
    depends_on:
      - app

networks:
  proxy:
    external: true
  firefly-internal:
