services:
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    restart: unless-stopped

    volumes:
      - ${DATA_PATH:?}/syncbrowser:/var/syncthing

    environment:
      - PUID=1000
      - PGID=1000

    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.rule=Host(`sync.${DOMAIN:?}`)"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"

    networks:
      - proxy

  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    restart: unless-stopped
    configs:
      - source: filebrowser_config
        target: /home/filebrowser/data/config.yaml
    volumes:
      - ${DATA_PATH:?}/syncbrowser/vaults:/folder
      - ${DATA_PATH:?}/filebrowser/data:/home/filebrowser/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN:?}`)"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
    networks:
      - proxy

configs:
  filebrowser_config:
    content: |
      server:
        sources:
          - path: /folder
            config:
              defaultEnabled: true
              denyByDefault: true

networks:
  proxy:
    external: true